---
name: CodeQL
"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  analyze-compiled:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-koehler/ktailctl-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          # The Go toolchain is statically linked, so CodeQL can't trace it
          # inside the CMake build. Prepare the sources (generated logging.go,
          # vendor/, cgo library) untraced, then let the Go autobuilder extract.
          - language: go
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKTAILCTL_ENABLE_TESTS=OFF \
            -DKTAILCTL_FLATPAK_BUILD=OFF \
            -DKTAILCTL_FETCH_GO=ON \
            | tee cmake-configure.log
      - name: Add fetched Go toolchain to PATH
        shell: bash
        run: |
          go_bin=$(grep -m1 '^-- Go executable:' cmake-configure.log | sed 's/^-- Go executable: //')
          dirname "${go_bin}" >> "${GITHUB_PATH}"
      - name: Prepare Go sources
        if: matrix.language == 'go'
        run: cmake --build build --parallel --target ktailctl_wrapper_target
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build
        if: matrix.language == 'c-cpp'
        run: cmake --build build --parallel
      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          working-directory: src/tailscale/wrapper
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
  analyze-interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
