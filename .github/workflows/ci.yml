---
name: CI
"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
jobs:
  git_hooks:
    name: Git hooks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-koehler/ktailctl-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKTAILCTL_ENABLE_TESTS=OFF \
            -DKTAILCTL_FLATPAK_BUILD=OFF \
            -DKTAILCTL_FETCH_GO=ON \
            | tee cmake-configure.log
      - name: Add fetched Go toolchain to PATH
        shell: bash
        run: |
          set -o pipefail
          go_bin=$(grep -m1 '^-- Go executable:' cmake-configure.log | sed 's/^-- Go executable: //')
          dirname "${go_bin}" >> "${GITHUB_PATH}"
      - name: Build
        run: cmake --build build --parallel
      - name: Run git hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: qmlformat
  flatpak_build:
    name: Flatpak Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/tailscale/wrapper/go.mod
          cache-dependency-path: src/tailscale/wrapper/go.sum
      - name: Vendor Go dependencies.
        run: go mod vendor
        working-directory: src/tailscale/wrapper
      - name: Update apt cache.
        run: sudo apt-get update -yq
      - name: Install flatpak-builder
        run: sudo apt-get install -yq flatpak-builder flatpak appstream
      - name: Show flatpak-builder version
        run: flatpak-builder --version
      - name: Install flatpak dependencies
        run: ./scripts/flatpak-deps.sh
      - name: Validate manifest
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
          manifest org.fkoehler.KTailctl.yml
      - name: Validate manifest
        run: |
          flatpak run org.flathub.flatpak-external-data-checker \
          --check-outdated org.fkoehler.KTailctl.yml
      - name: Build
        run: |
          flatpak-builder --user --force-clean \
          build-dir org.fkoehler.KTailctl.yml
  lint:
    name: Lint (${{ matrix.linter }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-koehler/ktailctl-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - linter: clang-tidy
            script: ./scripts/clang-tidy.sh
          - linter: clazy
            script: ./scripts/clazy.sh
          - linter: cppcheck
            script: ./scripts/cppcheck.sh
          - linter: iwyu
            script: ./scripts/iwyu.sh
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKTAILCTL_ENABLE_TESTS=OFF \
            -DKTAILCTL_FLATPAK_BUILD=OFF \
            -DKTAILCTL_FETCH_GO=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run ${{ matrix.linter }}
        run: ${{ matrix.script }}
  native_build:
    name: Native Build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-koehler/ktailctl-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
          - compiler: clang-sanitizers
            cc: clang
            cxx: clang++
            cmake_flags: >-
              -DKTAILCTL_ENABLE_ASAN=ON -DKTAILCTL_ENABLE_UBSAN=ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKTAILCTL_ENABLE_TESTS=ON \
            -DKTAILCTL_FLATPAK_BUILD=OFF \
            -DKTAILCTL_FETCH_GO=ON \
            ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  create_release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - git_hooks
      - flatpak_build
      - lint
      - native_build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup go.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/tailscale/wrapper/go.mod
          cache-dependency-path: src/tailscale/wrapper/go.sum
      - name: Create release
        run: ./scripts/create-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
