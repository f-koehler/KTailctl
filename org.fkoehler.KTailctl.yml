---
app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  env:
    GOTOOLCHAIN: local
    GOPROXY: off
cleanup:
  - /tools
modules:
  - name: go-toolchain
    buildsystem: simple
    build-commands:
      - mkdir -p /app/tools/go
      - cp -r . /app/tools/go
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
        sha256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
        x-checker-data:
          type: json
          url: https://go.dev/dl/?mode=json
          version-query: .[0].version
          url-query: '"https://go.dev/dl/" + (.[0].files[] | select(.os=="linux" and
            .arch=="amd64" and .kind=="archive") | .filename)'
      - type: archive
        only-arches:
          - aarch64
        url: https://go.dev/dl/go1.27.1.linux-arm64.tar.gz
        sha256: 3450b45a3f9ee8568792736a5c5e70a1f2e9b36c35a8f74958c03e51d7d92bec
        x-checker-data:
          type: json
          url: https://go.dev/dl/?mode=json
          version-query: .[0].version
          url-query: '"https://go.dev/dl/" + (.[0].files[] | select(.os=="linux" and
            .arch=="arm64" and .kind=="archive") | .filename)'
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DGO_EXECUTABLE=/app/tools/go/bin/go
    sources:
      - type: dir
        path: .
